# Hardware-specific settings for the BuzzVerse Node
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

# Random number generator required for LoRaWAN
CONFIG_ENTROPY_GENERATOR=y

# LoRaWAN application layer
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_NVM_SETTINGS=y

# LoRaWAN services
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_LOG_LEVEL_DBG=y

# NVS and Settings for storing LoRaWAN state
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# MCUBOOT for DFU
CONFIG_BOOTLOADER_MCUBOOT=y