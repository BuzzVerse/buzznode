# This file contains selected Kconfig options for the application.

CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NANOPB=y

CONFIG_RESET=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
CONFIG_STM32_WKUP_PINS=y

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

# General Zephyr settings
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y  

# Random number generator required for several LoRaWAN services
CONFIG_ENTROPY_GENERATOR=y

# LoRaWAN application layer
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_NVM_SETTINGS=y

# LoRaWAN services required for FUOTA
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_LOG_LEVEL_DBG=y

CONFIG_RTC=y
CONFIG_RTC_ALARM=y

CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_BOOTLOADER_MCUBOOT=y

# ADC config
CONFIG_ADC=y
CONFIG_CBPRINTF_FP_SUPPORT=y