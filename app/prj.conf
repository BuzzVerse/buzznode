# --- Language / libc ---
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y

# --- App deps ---
CONFIG_NANOPB=y

# --- Reset / power ---
CONFIG_RESET=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y

# STM32 wakeup pins support
CONFIG_STM32_WKUP_PINS=y

# --- Buses / peripherals ---
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_SPI=y
CONFIG_ADC=y

# --- Sensors ---
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

# --- Stacks ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Logging / console ---
# CONFIG_LOG=y
# CONFIG_LOG_PRINTK=n
CONFIG_PRINTK=y
CONFIG_SERIAL=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Helpful crash info
CONFIG_FAULT_DUMP=2
CONFIG_EXCEPTION_STACK_TRACE=y

# --- RNG ---
CONFIG_ENTROPY_GENERATOR=y

# --- RTC / alarm ---
CONFIG_RTC=y
CONFIG_RTC_ALARM=y

# --- Flash / settings ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# --- LoRa / LoRaWAN ---
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_NVM_SETTINGS=y

# LoRaWAN services (FUOTA etc.)
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_LOG_LEVEL_DBG=y

CONFIG_PM=n
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# --- Bootloader ---
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_CANARIES=y