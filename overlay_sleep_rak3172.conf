# overlay_sleep_rak3172.conf
# Apply with: -DEXTRA_CONF_FILE=../overlay_sleep_rak3172.conf

# PM options for low power
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n

# Disable all logging and console
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n

# Disable debug
CONFIG_DEBUG=n
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_DEBUG_OPTIMIZATIONS=n

CONFIG_LORAWAN_NVM_SETTINGS=n
